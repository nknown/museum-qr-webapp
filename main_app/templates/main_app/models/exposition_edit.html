{% extends "main_app/layout/base.html" %}
{% load static %}
{% load i18n %}



{% block content %}

    <div class="right floated sixteen wide  column" id="content">
        <div class="ui centered grid">
            <div class="row">
                <div class=" ui sixteen wide column">
                    <div class="ui header segment">
                        <h2>{% if form.instance.pk %}{% trans "Edit Exposition" %}{% else %}{% trans "New Exposition" %}{% endif %}</h2>
                    </div>
                </div>
            </div>


            <div class="row">
                <div class=" ui sixteen wide column">
                    <div class="ui segment">
                        <form class="ui form{% if errors %} error{% endif %}"  method="post">
                            {% csrf_token %}{{  form }}

                                <div class="ui divider"></div>
                                <button class="ui primary button" type="submit">Submit</button>
                                
                        </form>


                    </div>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
