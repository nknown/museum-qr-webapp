{% extends "main_app/layout/base.html" %}
{% load i18n %}

{% block title %}{% trans "New Museum" %}{% endblock %}

{% block content %}
<div class="right floated sixteen wide column" id="content">
    <div class="ui centered grid">
        <div class="row">
            <div class="ui sixteen wide column">
                <div class="ui header segment">
                    <h2>{% trans "New Museum" %}</h2>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="ui sixteen wide column">
                <div class="ui segment">
                    <form class="ui form" method="post">
                        {% csrf_token %}
                        {{ form }}
                        <div class="ui divider"></div>
                        <button class="ui primary button" type="submit">{% trans "Submit" %}</button>
                        <a class="ui button" href="{% url 'main_app:museums-list' %}">{% trans "Back" %}</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
