{% extends 'main_app/layout/base.html' %}
{% load static %}
{% load django_tables2 %}
{% load i18n %}

{% block title %} {% trans 'List of Slides' %} {% endblock %}

{% block content %}
    <div class="right floated sixteen wide  column" id="content">
        <div class="ui centered grid">
            <div class="row">
                <div class=" ui sixteen wide column">
                    <div class="ui header segment">
                        <h2><i class="film icon"></i>{% trans 'List of Slides' %}</h2>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class=" ui sixteen wide column">
                    <div class="ui segment">
                        <div class="ui blue ribbon icon label">{% trans 'List of all Slides' %}</div>
                        <div class="ui divider"></div>

                        {% render_table table %}
                    </div>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
