{% load wagtailcore_tags wagtailimages_tags i18n static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MIYP | {{ page.title }}</title>
  <link rel="shortcut icon" href="{% static 'wagtailadmin/images/favicon.ico' %}">
</head>
<body>
  <h1>{{ page.title }}</h1>
  {% if page.hero_image %}
    {% image page.hero_image fill-1200x500 as hero %}
    <img src="{{ hero.url }}" alt="{{ page.title }}">
  {% endif %}
  <div>{{ page.body|richtext }}</div>
{% include_block page.content %}
</body>
</html>
