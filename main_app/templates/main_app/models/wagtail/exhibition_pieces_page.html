{% load wagtailcore_tags %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
</head>
<body>
  <h1>{{ page.title }}</h1>
  <ul>
    {% for piece_page in piece_pages %}
      <li><a href="{% pageurl piece_page %}">{{ piece_page.title }}</a></li>
    {% empty %}
      <li>No pieces yet.</li>
    {% endfor %}
  </ul>
</body>
</html>
