{% load wagtailcore_tags wagtailimages_tags %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
</head>
<body>
  <h1>{{ page.title }}</h1>
  <div>{{ page.body|richtext }}</div>

  {% if page.gallery_images.all %}
    <section>
      {% for item in page.gallery_images.all %}
        {% image item.image width-1200 as img %}
        <figure>
          <img src="{{ img.url }}" alt="{{ item.caption|default:page.title }}">
          {% if item.caption %}<figcaption>{{ item.caption }}</figcaption>{% endif %}
        </figure>
      {% endfor %}
    </section>
  {% endif %}
</body>
</html>
