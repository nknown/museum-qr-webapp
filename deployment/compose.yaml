# Standalone hardened profile; the root docker-compose.yml remains for development.
name: miyp-production
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
services:
  db:
    image: postgres:16-bookworm
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
    environment:
      POSTGRES_DB: miyp_database
      POSTGRES_USER: miyp_user
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD:?Run configure.py first}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U miyp_user -d miyp_database']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: miyp-web:local
    env_file: deployment.env
    environment:
      DJANGO_SETTINGS_MODULE: deployment.settings
      MAIN_APP_PRODUCTION: 'on'
      MAIN_APP_REVERSE_PROXY: 'on'
      GOOGLE_OAUTH_USE_LOOPBACK_REDIRECT: 'off'
      DB_TYPE: postgres
      POSTGRES_DB_NAME: miyp_database
      POSTGRES_DB_USER: miyp_user
      POSTGRES_DB_HOST: db
      POSTGRES_DB_PORT: '5432'
      # Keep application demand below PostgreSQL's connection limit so health
      # checks and administrative sessions retain capacity.
      MIYP_HTTP_CONCURRENCY_LIMIT: ${MIYP_HTTP_CONCURRENCY_LIMIT:-75}
      CACHE: 'False'
      IPGEOLOCATION_API_KEY: ''
    volumes:
      - static:/app/static
      - media:/app/main_app/media
    networks: [frontend, database]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/ready/', headers={'Host': os.environ['PUBLIC_HOSTNAME'], 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(r, timeout=5)"
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 30s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    logging: *logging
  nginx:
    image: nginx:stable-alpine
    environment:
      NGINX_ENVSUBST_FILTER: '^(PUBLIC_HOSTNAME|PUBLIC_ORIGIN|HTTPS_PORT|TELEMETRY_LIMIT_DRY_RUN)$$'
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Run configure.py first}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Run configure.py first}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      TELEMETRY_LIMIT_DRY_RUN: ${TELEMETRY_LIMIT_DRY_RUN:-on}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./tls:/etc/nginx/certs:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
    networks: [frontend]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/health/nginx']
      interval: 15s
      timeout: 5s
      retries: 3
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    logging: *logging
networks:
  frontend:
  database:
    internal: true
volumes:
  database:
  static:
  media:
